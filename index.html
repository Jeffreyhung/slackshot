<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack Shot – turn a pasted Slack conversation into an image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
  :root { --ui-bg:#f4f5f7; --ui-panel:#fff; --ui-line:#dcdfe4; --ui-text:#1d1c1d; --ui-dim:#616061; --ui-accent:#1264a3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--ui-bg); color: var(--ui-text); display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: var(--ui-panel); border-bottom: 1px solid var(--ui-line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--ui-dim); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 420px) 1fr; }
  .left { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-right: 1px solid var(--ui-line); background: var(--ui-panel); min-height: 0; overflow: auto; }
  textarea { flex: 1; min-height: 220px; width: 100%; resize: none; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--ui-accent); outline-offset: -1px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ui-dim); }
  .opts label.check { flex-direction: row; align-items: center; gap: 6px; padding-top: 18px; }
  input[type=text], select { padding: 7px 8px; border: 1px solid var(--ui-line); border-radius: 6px; font: inherit; color: var(--ui-text); background: #fff; width: 100%; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ui-line); background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #007a5a; border-color: #007a5a; color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  #status { font-size: 12px; color: var(--ui-dim); }
  .hint { font-size: 12px; color: var(--ui-dim); margin: 0; }
  .hint code { background: #eee; padding: 0 3px; border-radius: 3px; }
  .right { overflow: auto; padding: 24px; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .left { border-right: 0; border-bottom: 1px solid var(--ui-line); } html, body { height: auto; } }

  /* ---------- the screenshot itself ---------- */
  #shot { --bg:#fff; --text:#1d1c1d; --dim:#616061; --link:#1264a3; --mention-bg:rgba(29,155,209,.1); --me-bg:#f8e8b9; --me-text:#1264a3;
          --code-bg:#f8f8f8; --code-line:#dddddd; --inline-code:#c0143c; --frame:#e9edf2; --shadow:0 1px 3px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10);
          display: inline-block; vertical-align: top; background: var(--bg); }
  #shot.dark { --bg:#1a1d21; --text:#d1d2d3; --dim:#ababad; --link:#1d9bd1; --mention-bg:rgba(29,155,209,.2); --me-bg:rgba(242,199,68,.3); --me-text:#f2c744;
          --code-bg:#222529; --code-line:#3b3d42; --inline-code:#e8912d; --frame:#0e1013; --shadow:0 1px 3px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.5); }
  #shot.framed { padding: 36px; background: var(--frame); }
  #shot .card { background: var(--bg); color: var(--text); padding: 12px 20px; font-family: Lato, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.46668; font-variant-ligatures: common-ligatures; -webkit-font-smoothing: antialiased; }
  #shot.framed .card { border-radius: 12px; box-shadow: var(--shadow); padding: 16px 24px; }
  .msg { display: flex; gap: 10px; padding: 8px 0; }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 6px; margin-top: 3px; color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; letter-spacing: .3px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.none { visibility: hidden; }
  .content { flex: 1; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 900; }
  .time { font-size: 12px; color: var(--dim); }
  .body > * { margin: 0; overflow-wrap: anywhere; }
  .body > * + * { margin-top: 8px; }
  .li { display: flex; gap: 8px; padding-left: 4px; }
  .li + .li { margin-top: 2px; }
  .li .dot { flex: none; width: 14px; text-align: center; }
  .body a { color: var(--link); text-decoration: none; }
  .mention { color: var(--link); background: var(--mention-bg); border-radius: 3px; padding: 0 2px 1px; }
  .mention.me { background: var(--me-bg); color: var(--me-text); }
  .body pre { font: 12px/1.50001 Monaco, Menlo, Consolas, "Courier New", monospace; background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 4px; padding: 8px; white-space: pre-wrap; }
  .body code { font: 12px/1.50001 Monaco, Menlo, Consolas, "Courier New", monospace; background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 3px; padding: 2px 3px 1px; color: var(--inline-code); }
  .quote { border-left: 4px solid var(--code-line); padding-left: 12px; }
  .edited { font-size: 13px; color: var(--dim); }
  .empty { color: var(--dim); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1>Slack Shot</h1>
  <span>Paste a copied Slack conversation, get a clean image. Everything stays in your browser.</span>
</header>
<main>
  <section class="left">
    <textarea id="input" spellcheck="false" placeholder="Paste Slack messages here…"></textarea>
    <div class="opts">
      <label>Time prefix <input type="text" id="prefix" placeholder="e.g. Yesterday at"></label>
      <label>Highlight mentions of <input type="text" id="me" placeholder="e.g. jeffrey, Jeffrey Hung"></label>
      <label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Width <select id="width"><option>560</option><option>720</option><option selected>880</option><option>1040</option></select></label>
      <label class="check"><input type="checkbox" id="framed" checked> Card frame with shadow</label>
    </div>
    <div class="actions">
      <button class="primary" id="download">Download PNG</button>
      <button id="copy">Copy image</button>
      <span id="status"></span>
    </div>
    <p class="hint">Click an avatar to use a real photo. Wrap text in <code>```</code> for a code block or <code>`backticks`</code> for inline code; start a line with <code>&gt;</code> for a quote.</p>
    <input type="file" id="file" accept="image/*" hidden>
  </section>
  <section class="right">
    <div id="shot"><div class="card" id="card"></div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SAMPLE = [
    'Ada Lovelace  [9:44 AM]',
    'Hey @grace, @Alan Turing, could I get your eyes on a couple of changes?',
    '',
    '• engine #12 (parser): https://github.com/example/engine/pull/12',
    '• engine #15 (renderer): https://github.com/example/engine/pull/15',
    '',
    '#12 is the base, #15 sits on top of it.',
    'Alan Turing  [3:08 PM]',
    'Looks good. One thing my linter found:',
    '',
    '```',
    'warning: unused variable `tape` in machine.rs:42',
    '```',
    'Grace Hopper  [3:35 PM]',
    'Found a bug. Literally.',
  ].join('\n');

  // ---------- storage (settings and avatars only, never the conversation) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('slackshot:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('slackshot:' + k, JSON.stringify(v)); } catch {} },
  };
  const avatars = store.get('avatars', {});

  // ---------- parsing ----------
  const TIME = String.raw`(\d{1,2}:\d{2}(?:\s?[AaPp][Mm])?)`;
  const BRACKET = new RegExp(String.raw`^(.*?)\s+\[` + TIME + String.raw`\]\s*$`);
  const BARE = new RegExp(String.raw`^(\S.{0,48}?)\s{2,}(\d{1,2}:\d{2}\s?[AaPp][Mm])\s*$`);

  const isName = (s) => s.length > 0 && s.length <= 50 && s.split(/\s+/).length <= 5 &&
    !/[!?:;]|[.,]\s|[.!?]\S|https?:|^[@•\-*>`#(]/.test(s);

  function strictHeader(line) {
    const m = BRACKET.exec(line) || BARE.exec(line);
    if (!m) return null;
    const name = m[1].trim();
    return isName(name) ? { name, time: m[2] } : null;
  }

  function parse(text) {
    const lines = text.replace(/\r\n?/g, '\n').replace(/ /g, ' ').split('\n');
    const known = new Set();
    for (const l of lines) { const h = strictHeader(l); if (h) known.add(h.name); }
    const names = [...known].sort((a, b) => b.length - a.length);

    const msgs = [];
    let cur = null;
    const push = (name, time) => { cur = { name, time, lines: [] }; msgs.push(cur); };
    const body = (l) => { if (!cur) push('', ''); cur.lines.push(l); };

    for (const l of lines) {
      const h = strictHeader(l);
      if (h) { push(h.name, h.time); continue; }
      // A header glued to the end of the previous message ("…the problem.Max Kosty  [3:12 PM]")
      const m = BRACKET.exec(l);
      if (m) {
        const pre = m[1];
        const n = names.find((n) => pre.endsWith(n));
        let split = n ? pre.length - n.length : -1;
        if (split < 0) {
          const g = /^(.*[.!?)"”`])\s*([A-Z][^.!?]{1,40})$/.exec(pre);
          if (g && isName(g[2].trim())) split = g[1].length;
        }
        if (split >= 0) {
          const before = pre.slice(0, split).trimEnd();
          if (before) body(before);
          push(pre.slice(split).trim(), m[2]);
          continue;
        }
      }
      body(l);
    }
    for (const m of msgs) {
      while (m.lines.length && !m.lines[0].trim()) m.lines.shift();
      while (m.lines.length && !m.lines[m.lines.length - 1].trim()) m.lines.pop();
    }
    return { msgs: msgs.filter((m) => m.name || m.lines.length), names };
  }

  function toBlocks(lines) {
    const out = [];
    let para = null, code = null;
    const flush = () => { para = null; };
    for (const raw of lines) {
      if (code) {
        const end = raw.indexOf('```');
        if (end >= 0) { if (raw.slice(0, end).trim()) code.push(raw.slice(0, end)); out.push({ t: 'code', text: code.join('\n') }); code = null; }
        else code.push(raw);
        continue;
      }
      if (/^\s*```/.test(raw)) {
        flush();
        const rest = raw.replace(/^\s*```/, '');
        const end = rest.indexOf('```');
        if (end >= 0) out.push({ t: 'code', text: rest.slice(0, end) });
        else { code = []; if (rest.trim()) code.push(rest); }
        continue;
      }
      const line = raw.trim();
      if (!line) { flush(); continue; }
      let m;
      if ((m = /^[•◦▪\-*]\s+(.*)$/.exec(line))) { flush(); out.push({ t: 'li', text: m[1] }); continue; }
      if ((m = /^(?:>|&gt;)\s?(.*)$/.exec(line))) {
        flush();
        const last = out[out.length - 1];
        if (last && last.t === 'quote') last.lines.push(m[1]); else out.push({ t: 'quote', lines: [m[1]] });
        continue;
      }
      if (!para) { para = { t: 'p', lines: [] }; out.push(para); }
      para.lines.push(line);
    }
    if (code) out.push({ t: 'code', text: code.join('\n') });
    return out;
  }

  // ---------- rendering ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const COLORS = ['#e01e5a', '#2eb67d', '#36c5f0', '#ecb22e', '#4a154b', '#1264a3', '#e8912d', '#007a5a', '#9b59b6', '#d94f70'];
  const colorFor = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
  const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');

  function inline(parent, text, ctx) {
    const edited = /\s*\(edited\)\s*$/.exec(text);
    if (edited) text = text.slice(0, edited.index);
    const namesAlt = ctx.names.length ? ctx.names.map(esc).join('|') + '|' : '';
    const re = new RegExp(
      '(`[^`\\n]+`)|(https?:\\/\\/[^\\s<>]+)|((?<![\\w/@])@(?:' + namesAlt +
      "[A-Z][\\w'’-]*(?: [A-Z][\\w'’-]+)?|[\\w-]+(?:\\.[\\w-]+)*))", 'g');
    let last = 0, m;
    const plain = (s) => { if (s) parent.append(s); };
    while ((m = re.exec(text))) {
      plain(text.slice(last, m.index));
      last = re.lastIndex;
      if (m[1]) parent.append(el('code', '', m[1].slice(1, -1)));
      else if (m[2]) {
        let url = m[2], tail = '';
        const t = /[.,;:!?'"]+$/.exec(url);
        if (t) { tail = t[0]; url = url.slice(0, -tail.length); }
        while (url.endsWith(')') && (url.match(/\(/g) || []).length < (url.match(/\)/g) || []).length) { url = url.slice(0, -1); tail = ')' + tail; }
        const a = el('a', '', url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        parent.append(a); plain(tail);
      } else {
        const who = m[3].slice(1).toLowerCase();
        parent.append(el('span', 'mention' + (ctx.me.includes(who) ? ' me' : ''), m[3]));
      }
    }
    plain(text.slice(last));
    if (edited) parent.append(' ', el('span', 'edited', '(edited)'));
  }

  function lines(parent, arr, ctx) {
    arr.forEach((l, i) => { if (i) parent.append(el('br')); inline(parent, l, ctx); });
    return parent;
  }

  function render() {
    const { msgs, names } = parse($('input').value);
    const ctx = { names, me: $('me').value.split(',').map((s) => s.trim().replace(/^@/, '').toLowerCase()).filter(Boolean) };
    const prefix = $('prefix').value.trim();
    const shot = $('shot'), card = $('card');
    shot.className = [$('theme').value === 'dark' ? 'dark' : '', $('framed').checked ? 'framed' : ''].join(' ').trim();
    card.style.width = $('width').value + 'px';
    card.replaceChildren();
    if (!msgs.length) { card.append(el('div', 'empty', 'Paste a conversation on the left to see it here.')); return; }

    for (const m of msgs) {
      const row = el('div', 'msg');
      const av = el('div', 'avatar' + (m.name ? '' : ' none'));
      if (m.name) {
        av.dataset.name = m.name; av.title = 'Click to set a photo for ' + m.name;
        if (avatars[m.name]) { const img = el('img'); img.src = avatars[m.name]; img.alt = ''; av.append(img); }
        else { av.style.background = colorFor(m.name); av.textContent = initials(m.name); }
      }
      const content = el('div', 'content');
      if (m.name) {
        const head = el('div', 'head');
        head.append(el('span', 'name', m.name));
        if (m.time) head.append(el('span', 'time', (prefix ? prefix + ' ' : '') + m.time));
        content.append(head);
      }
      const bodyEl = el('div', 'body');
      for (const b of toBlocks(m.lines)) {
        if (b.t === 'code') bodyEl.append(el('pre', '', b.text));
        else if (b.t === 'li') { const li = el('div', 'li'); li.append(el('span', 'dot', '•'), lines(el('span'), [b.text], ctx)); bodyEl.append(li); }
        else if (b.t === 'quote') bodyEl.append(lines(el('div', 'quote'), b.lines, ctx));
        else bodyEl.append(lines(el('p'), b.lines, ctx));
      }
      content.append(bodyEl);
      row.append(av, content);
      card.append(row);
    }
  }

  // ---------- avatar upload ----------
  let pendingName = null;
  $('card').addEventListener('click', (e) => {
    const av = e.target.closest('.avatar');
    if (!av || !av.dataset.name) return;
    if (avatars[av.dataset.name] && e.altKey) { delete avatars[av.dataset.name]; store.set('avatars', avatars); render(); return; }
    pendingName = av.dataset.name; $('file').value = ''; $('file').click();
  });
  $('file').addEventListener('change', () => {
    const f = $('file').files[0];
    if (!f || !pendingName) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 144;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 144, 144);
      avatars[pendingName] = c.toDataURL('image/png');
      store.set('avatars', avatars);
      URL.revokeObjectURL(img.src);
      render();
    };
    img.src = URL.createObjectURL(f);
  });

  // ---------- export ----------
  const status = (s) => { $('status').textContent = s; };
  let warmed = false;
  async function toBlob() {
    await document.fonts.ready;
    const node = $('shot');
    const opts = { pixelRatio: 2, backgroundColor: getComputedStyle(node).backgroundColor };
    if (!warmed) { await htmlToImage.toBlob(node, opts); warmed = true; } // first pass can miss fonts in Safari
    return htmlToImage.toBlob(node, opts);
  }
  async function run(btn, fn, done) {
    btn.disabled = true; status('Rendering…');
    try { await fn(); status(done); } catch (e) { console.error(e); status('Failed: ' + (e && e.message || e)); }
    btn.disabled = false;
  }
  $('download').addEventListener('click', (e) => run(e.target, async () => {
    const blob = await toBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'slack-conversation.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'Downloaded.'));
  $('copy').addEventListener('click', (e) => run(e.target, async () => {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': toBlob() })]);
  }, 'Copied to clipboard.'));

  // ---------- wiring ----------
  for (const id of ['prefix', 'me', 'theme', 'width', 'framed']) {
    const e = $(id), key = e.type === 'checkbox' ? 'checked' : 'value';
    const saved = store.get(id, null);
    if (saved != null) e[key] = saved;
    e.addEventListener('input', () => { store.set(id, e[key]); render(); });
  }
  $('input').value = SAMPLE;
  $('input').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
